name: Validate packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned schema and skill validators
        run: python -m pip install jsonschema==4.25.1 skills-ref==0.1.1

      - name: Check package invariants
        run: node scripts/check-package.mjs --check

      - name: Check skill release bookkeeping
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release.mjs "$BASE_SHA"

      - name: Validate portable Agent Plugins manifest
        run: |
          curl --fail --silent --show-error \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            --output "$RUNNER_TEMP/agent-plugin-1.0.0.schema.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path.cwd()
          schema = json.loads(Path(os.environ["RUNNER_TEMP"], "agent-plugin-1.0.0.schema.json").read_text())
          manifest = json.loads((root / "plugins/vdufloth/plugin.json").read_text())
          Draft202012Validator(schema).validate(manifest)
          PY

      - name: Validate Agent Skills
        run: python scripts/validate-skills-reference.py

      - name: Validate Claude package adapters
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.278 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.278 plugin validate plugins/vdufloth --strict

      - name: Test always-on installer
        run: bash scripts/test-install-code-style.sh

      - name: Verify skills CLI discovery
        run: |
          marketplace_source="$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            marketplace_source="vdufloth/agent-plugins"
          fi
          npx --yes skills@1.7.0 add "$marketplace_source" --list | tee "$RUNNER_TEMP/skills-list.txt"
          node scripts/assert-discovery.mjs skills-list "$RUNNER_TEMP/skills-list.txt"

      - name: Verify Codex marketplace discovery and install
        run: |
          profile="$RUNNER_TEMP/codex-profile"
          marketplace_source="$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            marketplace_source="vdufloth/agent-plugins"
          fi
          mkdir -p "$profile"
          HOME="$profile" npx --yes @openai/codex@0.154.0 plugin marketplace add "$marketplace_source" --json
          HOME="$profile" npx --yes @openai/codex@0.154.0 plugin list \
            --marketplace vdufloth-agent-plugins --available --json \
            > "$RUNNER_TEMP/codex-plugins.json"
          HOME="$profile" npx --yes @openai/codex@0.154.0 plugin add \
            vdufloth@vdufloth-agent-plugins --json \
            > "$RUNNER_TEMP/codex-install.json"
          node scripts/assert-discovery.mjs codex \
            "$RUNNER_TEMP/codex-plugins.json" "$RUNNER_TEMP/codex-install.json"

      - name: Verify Claude marketplace install
        run: |
          profile="$RUNNER_TEMP/claude-profile"
          marketplace_source="$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            marketplace_source="vdufloth/agent-plugins"
          fi
          mkdir -p "$profile"
          HOME="$profile" npx --yes @anthropic-ai/claude-code@2.1.278 \
            plugin marketplace add "$marketplace_source"
          HOME="$profile" npx --yes @anthropic-ai/claude-code@2.1.278 \
            plugin install vdufloth@vdufloth-claude-plugins --scope user --yes --json
          HOME="$profile" npx --yes @anthropic-ai/claude-code@2.1.278 \
            plugin list --json > "$RUNNER_TEMP/claude-plugins.json"
          node scripts/assert-discovery.mjs claude "$RUNNER_TEMP/claude-plugins.json"
